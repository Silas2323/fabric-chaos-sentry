hostname spine2
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description leaf1
   no switchport
   ip address 10.1.1.17/30
!
interface Ethernet2
   description leaf2
   no switchport
   ip address 10.1.1.21/30
!
interface Ethernet3
   description leaf3
   no switchport
   ip address 10.1.1.25/30
!
interface Ethernet4
   description leaf4
   no switchport
   ip address 10.1.1.29/30
!
interface Loopback0
   ip address 10.0.0.2/32
!
ip routing
!
router bgp 65100
   router-id 10.0.0.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community extended
   neighbor 10.1.1.18 peer group UNDERLAY
   neighbor 10.1.1.18 remote-as 65101
   neighbor 10.1.1.22 peer group UNDERLAY
   neighbor 10.1.1.22 remote-as 65102
   neighbor 10.1.1.26 peer group UNDERLAY
   neighbor 10.1.1.26 remote-as 65103
   neighbor 10.1.1.30 peer group UNDERLAY
   neighbor 10.1.1.30 remote-as 65104
   !
   address-family evpn
      neighbor UNDERLAY activate
      neighbor UNDERLAY next-hop-unchanged
   !
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.0.0.2/32
!
end
