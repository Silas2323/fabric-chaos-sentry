hostname spine1
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description leaf1
   no switchport
   ip address 10.1.1.1/30
!
interface Ethernet2
   description leaf2
   no switchport
   ip address 10.1.1.5/30
!
interface Ethernet3
   description leaf3
   no switchport
   ip address 10.1.1.9/30
!
interface Ethernet4
   description leaf4
   no switchport
   ip address 10.1.1.13/30
!
interface Loopback0
   ip address 10.0.0.1/32
!
ip routing
!
router bgp 65100
   router-id 10.0.0.1
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community extended
   neighbor 10.1.1.2 peer group UNDERLAY
   neighbor 10.1.1.2 remote-as 65101
   neighbor 10.1.1.6 peer group UNDERLAY
   neighbor 10.1.1.6 remote-as 65102
   neighbor 10.1.1.10 peer group UNDERLAY
   neighbor 10.1.1.10 remote-as 65103
   neighbor 10.1.1.14 peer group UNDERLAY
   neighbor 10.1.1.14 remote-as 65104
   !
   address-family evpn
      neighbor UNDERLAY activate
      neighbor UNDERLAY next-hop-unchanged
   !
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.0.0.1/32
!
end
