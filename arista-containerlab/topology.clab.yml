name: arista-evpn

topology:
  kinds:
    arista_ceos:
      image: ceos:4.32.0F
    linux:
      image: alpine:3.20

  nodes:
    # startup-delay staggers the cEOS boots (~45s apart) so the host CPU doesn't spike.
    spine1:
      kind: arista_ceos
      startup-config: configs/spine1.cfg
    spine2:
      kind: arista_ceos
      startup-config: configs/spine2.cfg
      startup-delay: 45
    leaf1:
      kind: arista_ceos
      startup-config: configs/leaf1.cfg
      startup-delay: 90
    leaf2:
      kind: arista_ceos
      startup-config: configs/leaf2.cfg
      startup-delay: 135
    leaf3:
      kind: arista_ceos
      startup-config: configs/leaf3.cfg
      startup-delay: 180
    leaf4:
      kind: arista_ceos
      startup-config: configs/leaf4.cfg
      startup-delay: 225

    # Hosts: odd = VLAN 10 (10.10.10.0/24) on leaf eth3, even = VLAN 20 (10.20.20.0/24) on leaf eth4.
    host1:
      kind: linux
      cmd: tail -f /dev/null
      exec:
        - ip link set dev eth1 address 00:aa:bb:00:00:01
        - ip addr add 10.10.10.11/24 dev eth1 #LEAF1 VLAN10
    host2:
      kind: linux
      cmd: tail -f /dev/null
      exec:
        - ip link set dev eth1 address 00:aa:bb:00:00:02
        - ip addr add 10.20.20.11/24 dev eth1 #LEAF1 VLAN20
    host3:
      kind: linux
      cmd: tail -f /dev/null
      exec:
        - ip link set dev eth1 address 00:aa:bb:00:00:03
        - ip addr add 10.10.10.12/24 dev eth1 #LEAF2 VLAN10
    host4:
      kind: linux
      cmd: tail -f /dev/null
      exec:
        - ip link set dev eth1 address 00:aa:bb:00:00:04
        - ip addr add 10.20.20.20/24 dev eth1 #LEAF2 VLAN20
    # host5:
    #   kind: linux
    #   cmd: tail -f /dev/null
    #   exec:
    #     - ip link set dev eth1 address 00:aa:bb:00:00:05
    #     - ip addr add 10.10.10.13/24 dev eth1 #LEAF3
    # host6:
    #   kind: linux
    #   cmd: tail -f /dev/null
    #   exec:
    #     - ip link set dev eth1 address 00:aa:bb:00:00:06
    #     - ip addr add 10.20.20.13/24 dev eth1 #LEAF3
    # host7:
    #   kind: linux
    #   cmd: tail -f /dev/null
    #   exec:
    #     - ip link set dev eth1 address 00:aa:bb:00:00:07
    #     - ip addr add 10.10.10.14/24 dev eth1 #LEAF4
    # host8:
    #   kind: linux
    #   cmd: tail -f /dev/null
    #   exec:
    #     - ip link set dev eth1 address 00:aa:bb:00:00:08
    #     - ip addr add 10.20.20.14/24 dev eth1 #LEAF4

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]
    - endpoints: ["leaf1:eth3", "host1:eth1"] #LEAF1-VLAN10
    - endpoints: ["leaf1:eth4", "host2:eth1"] #LEAF1-VLAN20
    - endpoints: ["leaf2:eth3", "host3:eth1"] #LEAF2-VLAN10
    - endpoints: ["leaf2:eth4", "host4:eth1"] #LEAF2-VLAN20
    # - endpoints: ["leaf3:eth3", "host3:eth1"]
    # # - endpoints: ["leaf3:eth4", "host6:eth1"]
    # - endpoints: ["leaf4:eth3", "host4:eth1"]
    # # - endpoints: ["leaf4:eth4", "host8:eth1"]
